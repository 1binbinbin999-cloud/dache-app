# 大车 APP 打包：Android APK，v0.1.3（只做安卓；Windows 版这次不构建、不发版）
# 触发：android/、web/、windows/ 或本文件有推送时跑；也可手动跑（Actions 页 workflow_dispatch）。
# 注意：版本号 v0.1.3 在本文件里写死（release job 的 tag_name 与文件名）。
# 下一版发版时，把 v0.1.3 / dache-0.1.3.* / versionCode 一起改掉。
name: dache-app

on:
  push:
    paths:
      - 'android/**'
      - 'web/**'
      - 'windows/**'
      - '.github/workflows/dache-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        # 不用 android-actions/setup-android：它下载的 sdkmanager 在 --licenses 时会交互式追问，CI 里挂掉。
        # 直接用 runner 自带的 SDK（/usr/local/lib/android/sdk），yes 管道非交互接受许可。
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /tmp/sdkmanager-licenses.log 2>&1 || { tail -20 /tmp/sdkmanager-licenses.log; exit 1; }
          echo "licenses accepted"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Restore release keystore from Secrets
        run: |
          echo "${{ secrets.DACHE_KEYSTORE_BASE64 }}" | base64 -d > /tmp/dache-release.p12
          test -s /tmp/dache-release.p12
      - name: Build release APK
        working-directory: android
        env:
          DACHE_KEYSTORE_FILE: /tmp/dache-release.p12
          DACHE_KEYSTORE_PASSWORD: ${{ secrets.DACHE_KEYSTORE_PASSWORD }}
          DACHE_KEY_ALIAS: ${{ secrets.DACHE_KEY_ALIAS }}
          DACHE_KEY_PASSWORD: ${{ secrets.DACHE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk dache-0.1.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dache-0.1.3.apk
          path: dache-0.1.3.apk
          if-no-files-found: error

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create Release v0.1.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3
          name: 大车 v0.1.3
          body: |
            大车 v0.1.3（安卓）：修两处。①解卦能正常显示了（之前是应用自己的安全规则拦了内嵌的卦象数据加载，不是网络问题）；②实验室能导入 xlsx 文件了（补了文件选择器）。
            首次打开需设置密码（至少 8 位）与恢复码（由你自己定）；以后每次进入都要输密码；同步需在首次设置里粘贴 dache-sync 令牌（可跳过）。
            安装：下载 APK 安装（需允许安装未知来源应用）；已装 v0.1.2 的直接覆盖安装，记录不丢。
          files: |
            dist/dache-0.1.3.apk/dache-0.1.3.apk
